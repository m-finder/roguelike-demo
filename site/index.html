<!DOCTYPE html>
<html>
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">
  <link rel="stylesheet" type="text/css" href="style.css"/>
  <style>
    #pc-side-ad {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 0;
      width: 728px;
      height: 90px;
      overflow: hidden;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.12);
    }

    #pc-side-ad iframe {
      display: block;
      border: 0;
      width: 728px;
      height: 90px;
    }

    #mobile-bottom-ad {
      display: none;
      position: fixed;
      z-index: 1001;
      left: 50%;
      bottom: 0;
      width: 468px;
      height: 60px;
      overflow: hidden;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.12);
    }

    #mobile-bottom-ad iframe {
      display: block;
      border: 0;
      width: 468px;
      height: 60px;
    }

    @media (min-width: 1200px) and (pointer: fine) {
      #pc-side-ad { display: block; }
    }

    @media (max-width: 767px), (pointer: coarse) and (max-width: 1199px) {
      #mobile-bottom-ad { display: block; }
    }
  </style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>

  <div id="pc-side-ad" aria-label="Advertisement">

  </div>

  <div id="mobile-bottom-ad" aria-label="Advertisement">
    <script>
      atOptions = {
